[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wom-api"
version = "0.1.0"
description = "Async Python client for the Minesweeper Online Socket.IO data API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tianyi Pu"}]
keywords = ["minesweeper", "minesweeper-online", "socketio", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Puzzle Games",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.12,<4", "python-socketio[asyncio_client]>=5.16,<6"]

[project.urls]
Repository = "https://github.com/putianyi889/wom-api"
Documentation = "https://github.com/putianyi889/wom-api/blob/main/docs/index.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.15,<3", "build>=1.2,<2", "twine>=6,<8"]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6", "furo>=2025.7.19"]
research = ["tree-sitter>=0.25,<0.27", "tree-sitter-javascript>=0.25,<0.26", "genson>=1.3,<2"]
system-certs = ["truststore>=0.10,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wom_api"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/docs", "/examples", "/pyproject.toml", "/README.md", "/LICENSE", "/.github", "/.readthedocs.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".research*", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"] # Public request deadlines intentionally include connection and pacing.

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/wom_api"]

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true
