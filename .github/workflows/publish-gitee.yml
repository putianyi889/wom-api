name: Publish Gitee Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published GitHub Release tag, e.g. v0.1.0'
        required: true
        type: string
      repository:
        description: 'Gitee target owner/repo (must contain the same tag)'
        default: putianyi889/wom-api
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-gitee-${{ inputs.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Gitee credential configuration
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo 'Configure the GITEE_TOKEN repository secret before publishing.' >&2
            exit 1
          fi
      # The publisher is taken from the workflow ref, so it can publish older
      # releases whose source tag predates Gitee support.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - name: Download published GitHub assets and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir dist
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" > release-commit.txt
      - name: Verify and publish to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ inputs.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/publish_gitee.py --repo "$GITEE_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$(cat release-commit.txt)" --manifest release.json --dist dist
