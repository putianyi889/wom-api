name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[dev,docs,research]"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from wom_api import __version__

          package_version = version("wom-api")
          expected = f"v{package_version}"
          if __version__ != package_version:
              raise SystemExit("pyproject.toml and wom_api.__version__ differ")
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must match package version: {expected}")
          print(f"Verified release version: {expected}")
          PY
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python tools/generate.py --check
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Package HTML documentation
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("docs/_build/html")
          with ZipFile(f"dist/wom_api-{version('wom-api')}-docs.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and ".doctrees" not in path.parts and path.name != ".buildinfo":
                      archive.write(path, path.relative_to(root))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GH_REPO"
          --verify-tag
          --title "wom-api $RELEASE_TAG"
          --generate-notes
